name: Issues report / Reporte de errores
description: Report a problem / Reporta un problema
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in all fields so we can help you faster, thank you!
        / Llena todos los campos para poder ayudarte más rápido, gracias!

  - type: dropdown
    id: problem-type
    attributes:
      label: Type of problem / Tipo de problema
      options:
        - Installation / Instalación
        - Internal analysis / Análisis interno
        - External analysis / Análisis externo
        - Color correction / Corrección de color
        - CLI
        - Documentation / Documentación
        - Other / Otro
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened? / ¿Qué pasa?
      description: |
        Please describe the problem, what you are trying to achieve, and the image(s) you are analyzing (attach it here if possible).

        Por favor describe el problema, lo que intentas lograr y la(s) imagen(es) que estas analizando (adjúntala aquí si es posible).
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code you are using / Código que estás corriendo
      description: Copy the exact code you ran / Copia el código con el que estas trabajando
      render: python
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message / Mensaje de error
      description: Copy the complete error / Copia el error completo
      render: shell
    validations:
      required: true

  - type: textarea
    id: system-info
    attributes:
      label: System information / Información del sistema
      description: |
        Run `traitly info` in your terminal and paste the output here (replace the template below).

        If your version is older than 0.2.0 (the command does not exist), fill in the template below instead.

        ----

        Ejecuta `traitly info` en tu terminal y pega el resultado aquí (reemplaza la plantilla de abajo).

        Si tu versión es anterior a 0.2.0 (el comando no existe), completa la plantilla de abajo.
      value: |
        Traitly version / Versión de Traitly:
        Python version / Versión de Python:
        Operating system / Sistema operativo (macOS, Windows, Linux):
        Architecture / Arquitectura (Intel, Apple Silicon, etc.):
      render: shell
    validations:
      required: true
