name: Question / Pregunta
description: Ask how to use Traitly / Pregunta sobre cómo usar Traitly
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the documentation first. / Por favor revisa primero la documentación.

  - type: textarea
    id: question
    attributes:
      label: Your question / Tu pregunta
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code you are using (if any) / Código que estás usando (si aplica)
      render: python
    validations:
      required: false

  - type: textarea
    id: system-info
    attributes:
      label: System information (optional) / Información del sistema (opcional)
      description: |
        You can get it by running `traitly info` in the terminal (available from version 0.2.0). If you have an older version, please fill in the list below.
        / Puedes obtenerla ejecutando `traitly info` en la terminal (disponible desde la versión 0.2.0). Si tienes una versión anterior, completa la lista de abajo.
      value: |
        - Traitly version / Versión de Traitly:
        - Python version / Versión de Python:
        - Operating system / Sistema operativo:
        - Architecture (Intel, Apple Silicon, etc.) / Arquitectura:
      render: shell
