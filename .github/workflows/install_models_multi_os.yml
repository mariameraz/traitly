name: Check models in pip install
on:
  workflow_dispatch:

jobs:
  check-models:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install traitly from PyPI
        run: pip install traitly
      - name: Check models exist
        run: |
          python -c "
          import traitly, os
          base = os.path.dirname(traitly.__file__)
          models = ['package_data/models/size_reference.pt', 'package_data/models/label.pt']
          for m in models:
              path = os.path.join(base, m)
              exists = os.path.exists(path)
              assert exists, f'Model not found: {path}'
          "
