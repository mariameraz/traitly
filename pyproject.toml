[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "traitly"
version = "0.1.5"
description = "Computer vision toolkit for high-throughput fruit phenotyping."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
license-files = ["LICENSE*"]

authors = [
  { name = "Maria Alejandra Torres Meraz", email = "ma.torresmeraz@gmail.com" },
  { name = "Hector Lopez Moreno", email = "hectorlpzmno@gmail.com" }
]

dependencies = [
  "opencv-contrib-python",
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "tqdm",
  "psutil",
  "easyocr",
  "ultralytics",
]


keywords = [
  "plant-phenotyping",
  "fruit-morphology",
  "plant-breeding"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
pdf = ["PyMuPDF"]
all = ["PyMuPDF", "shiny"]

dev = ["pytest", "pytest-cov"]

[project.scripts]
traitly = "traitly.cli:main"
traitly-app = "traitly.shiny_app.app:run"

[project.urls]
Repository = "https://github.com/mariameraz/traitly"
Documentation = "https://traitly.readthedocs.io/en/latest/"
Issues = "https://github.com/mariameraz/traitly/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/traitly"]

[tool.hatch.build]
include = [
  "src/traitly/**",
  "README.md",
  "LICENSE*"
]
