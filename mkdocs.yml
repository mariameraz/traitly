###############
# Metadata  ###
###############

site_name: Traitly
# site_url: https://mariameraz.github.io/traitly
site_description: Fruit phenotyping tool for morphological, structural, and color analysis
site_author: Maria Meraz
repo_name: mariameraz/traitly
repo_url: https://github.com/mariameraz/traitly

######################
# Theme configuration #
######################

theme:
  name: material
  icon:
    alternate: octicons/globe-24
    repo: fontawesome/brands/github-alt
    # view: material/eye

  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default # Light theme
      primary: black
      accent: blue gray # For headers, links, etc 
      toggle:
        icon: octicons/sun-24
        name: Switch to dark mode

    - scheme: slate # Dark theme
      primary: white
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.tabs.sticky # Visible tabs while scrolling.
    - navigation.path # Shows the current page's path in the nav.
    - navigation.sections # Shows section headers in the nav as collapsible groups.
    - navigation.expand # Expand navegation tree
    - navigation.indexes
    - navigation.top # Adds a top bar at the bottom of the page 
    - navigation.footer
    
    - search.highlight
    - search.share
    - search.suggest

    - content.code.copy
    - content.code.select
    - content.code.annotate

    - toc.follow
    - toc.integrate


#######################
# Markdown extensions #
#######################

markdown_extensions:
  - admonition
  - pymdownx.details # to collapse admotions 
  - pymdownx.superfences
 
  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true
  
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - tables
  - attr_list # for markdowon atributes
  - md_in_html # for html  

  - toc:
      permalink: true


###########
# Plugins #
###########
plugins:
  - search
  # - mkdocs-jupyter:
  #     ignore_h1_titles: True

  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true

        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Installation: Instalación
            User Guide: Guía de Uso
            Results: Resultados
            Measurements: Mediciones
            Tutorials: Tutoriales
            Overview: Descripción General
            Quickstart: Inicio Rápido
            Internal Analysis: Análisis Interno
            External Analysis: Análisis Externo
            API Reference: Referencia API
            Changelog: Historial de Cambios
            Image Specifications: Especificaciones de Imágenes
            Internal Analyzer Class: Clase de Analizador Interno
            External Analyzer Class: Clase de Analizador Externo
            Traitly Architecture: Arquitectura de Traitly
            Classes: Clases
            Modules: Módulos
            About: Acerca de
            Command Line Interface: Interfaz de Línea de Comandos

  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_category_heading: true
            members_order: source

  - git-committers:
      repository: mariameraz/traitly
      branch: main
      token: !ENV MKDOCS_GIT_COMMITTERS_APIKEY
      exclude:
        - index.md
        - es/index.md

  - git-revision-date-localized:
      type: date
      enable_creation_date: true
      locale: es
      exclude:
        - index.md
        - es/index.md

####################
# Navigation setup #
####################

nav:
  - Home: index.md

  - Installation: installation.md

  - User Guide: 
      -  Traitly Architecture: workflow/overview.md
      - Internal analysis: 
        - Image Specifications: workflow/int_image_requirements.md
        - Internal Analyzer Class: workflow/internal_class.md  
      - External analysis:
        - Image Specifications: workflow/ext_image_requirements.md
        - External Analyzer Class: workflow/external_class.md
      - CLI:
        - Command Line Interface: workflow/cli.md
      - Results: 
        - Overview: workflow/results/overview.md
        - Measurements: workflow/results/measurements.md

  - Tutorials:
      - Overview: tutorials/overview.md
      - Quickstart: tutorials/quickstart.md
      - External Analysis: tutorials/external.md
      - Background Segmentation: en/tutorials/background_segmentation.md


  - API Reference:
      - Classes:
          - FruitInternalAnalyzer: en/api/internal_analysis.md
          - FruitExternalAnalyzer: en/api/external_analysis.md

      - Modules:
          - mask: en/api/mask.md
          - processing: en/api/processing.md
          - color_analysis: en/api/color_analysis.md
          - symmetry: en/api/symmetry.md
          - color_plot: en/api/color_plot.md
          - analysis_parameters: en/api/analysis_parameters.md
  
  - About: about.md
  - Changelog: en/changelog.md

