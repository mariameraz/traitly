###############
# Metadata  ###
###############

site_name: Traitly
# site_url: https://mariameraz.github.io/traitly
site_description: Fruit phenotyping tool for morphological, structural, and color analysis
site_author: Maria Meraz
repo_name: mariameraz/traitly
repo_url: https://github.com/mariameraz/traitly

######################
# Theme configuration #
######################

theme:
  name: material
  icon:
    alternate: octicons/globe-24
    repo: fontawesome/brands/github-alt
    # view: material/eye

  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default # Light theme
      primary: black
      accent: blue gray # For headers, links, etc
      toggle:
        icon: octicons/sun-24
        name: Switch to dark mode

    - scheme: slate # Dark theme
      primary: white
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.tabs.sticky # Visible tabs while scrolling.
    - navigation.path # Shows the current page's path in the nav.
    - navigation.sections # Shows section headers in the nav as collapsible groups.
    - navigation.expand # Expand navegation tree
    - navigation.indexes
    - navigation.top # Adds a top bar at the bottom of the page
    - navigation.footer

    - search.highlight
    - search.share
    - search.suggest

    - content.code.copy
    - content.code.select
    - content.code.annotate

    - toc.follow
    - toc.integrate

#######################
# Markdown extensions #
#######################

markdown_extensions:
  - admonition
  - pymdownx.details # to collapse admotions
  - pymdownx.superfences
  - tables
  - attr_list # for markdowon atributes
  - md_in_html # for html
  - pymdownx.snippets

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - toc:
      permalink: true

###########
# Plugins #
###########
plugins:
  - search
  # - mkdocs-jupyter:
  #     ignore_h1_titles: True

  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
          nav:
            - Home: en/index.md

            - Installation: en/installation.md

            - User Guide:
                - Overview: en/user_guide/overview.md
                - Image Specifications:
                    - Fruit Internal Images: en/user_guide/int_image_requirements.md
                    - Fruit External Images: en/user_guide/ext_image_requirements.md
                - How to Use Traitly:
                    - Python:
                        - Internal Analysis: en/user_guide/internal_class.md
                        - External Analysis: en/user_guide/external_class.md
                    - CLI: en/user_guide/cli.md
                - Results:
                    - Overview: en/user_guide/results/overview.md
                    - Measurements: en/user_guide/results/measurements.md

            - Tutorials:
                - Overview: en/tutorials/overview.md

            - API:
                - Index: en/api/index.md
                - Modules:
                    - mask: docstrings/modules/mask.md
                    - processing: docstrings/modules/processing.md
                    - color_analysis: docstrings/modules/color_analysis.md
                    - symmetry: docstrings/modules/symmetry.md
                    - color_plot: docstrings/modules/color_plot.md
                    - analysis_parameters: docstrings/modules/analysis_parameters.md
                    - basic_functions: docstrings/modules/basic_functions.md
                    - geometry: docstrings/modules/geometry.md
                    - fruit_config: docstrings/modules/fruit_config.md
                    - calibration: docstrings/modules/calibration.md
                    - label: docstrings/modules/label.md
                    - convert_pdf: docstrings/modules/convert_pdf.md
                    - cli: docstrings/modules/cli.md
                    - external: docstrings/modules/external_analysis.md
                    - internal: docstrings/modules/internal_analysis.md


            #- About: en/about.md
            - Changelog: en/changelog.md

        - locale: es
          name: Español
          build: true
          nav:
            - Home: es/index.md

            - Installation: es/installation.md

            - User Guide:
                - Overview: es/user_guide/overview.md
                - Image Specifications:
                    - Fruit Internal Images: es/user_guide/int_image_requirements.md
                    - Fruit External Images: es/user_guide/ext_image_requirements.md
                - How to Use Traitly:
                    - Python:
                        - Internal Analysis: es/user_guide/internal_class.md
                        - External Analysis: es/user_guide/external_class.md
                    - CLI: es/user_guide/cli.md
                - Results:
                    - Overview: es/user_guide/results/overview.md
                    - Measurements: es/user_guide/results/measurements.md

            - Tutorials:
                - Overview: es/tutorials/overview.md

            - API:
              - Index: es/api/index.md
              - Modules:
                  - mask: docstrings/modules/mask.md
                  - processing: docstrings/modules/processing.md
                  - color_analysis: docstrings/modules/color_analysis.md
                  - symmetry: docstrings/modules/symmetry.md
                  - color_plot: docstrings/modules/color_plot.md
                  - analysis_parameters: docstrings/modules/analysis_parameters.md
                  - basic_functions: docstrings/modules/basic_functions.md
                  - geometry: docstrings/modules/geometry.md
                  - fruit_config: docstrings/modules/fruit_config.md
                  - calibration: docstrings/modules/calibration.md
                  - label: docstrings/modules/label.md
                  - convert_pdf: docstrings/modules/convert_pdf.md
                  - cli: docstrings/modules/cli.md
                  - external: docstrings/modules/external_analysis.md
                  - internal: docstrings/modules/internal_analysis.md

            #- About: es/about.md
            - Changelog: es/changelog.md

          nav_translations:
            Home: Inicio
            Installation: Instalación

            User Guide: Guía de Uso
            Image Specifications: Especificaciones de Imágenes
            Fruit Internal Image: Imagen interna del fruto
            Fruit External Image: Imagen externa del fruto
            How to Use Traitly: Cómo Usar Traitly
            Internal Analysis: Análisis Interno
            External Analysis: Análisis Externo
            Results: Resultados
            Measurements: Mediciones

            Tutorials: Tutoriales
            Overview: Descripción General
            Quickstart: Inicio Rápido

            # API Reference: Referencia API

            Changelog: Registro de Cambios

            Traitly Architecture: Arquitectura de Traitly
            Classes: Clases
            Modules: Módulos
            About: Acerca de
            Command Line Interface: Interfaz de Línea de Comandos
            Background Segmentation: Segmentación del Fondo
            Locule Segmentation: Segmentación de lóculos
            Individual Analysis: Análisis Individual
            Batch Analysis: Análisis por Lotes

  - include-markdown

  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_category_heading: true
            members_order: source

  - git-committers:
      repository: mariameraz/traitly
      branch: main
      token: !ENV MKDOCS_GIT_COMMITTERS_APIKEY
      exclude:
        - en/index.md
        - es/index.md

  - git-revision-date-localized:
      type: date
      enable_creation_date: true
      locale: es
      exclude:
        - en/index.md
        - es/index.md

